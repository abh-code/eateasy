<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocktail Pairing — EatEasy</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Splide.js: JS Library #2 (image slider) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <style>
    .cocktail-thumb {
      background: var(--white);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 3px solid transparent;
    }
    .cocktail-thumb:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .cocktail-thumb.selected { border-color: var(--gold); }
    .cocktail-thumb img { width: 100%; height: 160px; object-fit: cover; }
    .cocktail-thumb p { padding: 0.6rem 0.75rem; font-size: 0.85rem; font-weight: 600; font-family: 'Playfair Display', serif; }
    .cocktail-thumb small { padding: 0 0.75rem 0.75rem; display:block; font-size:0.75rem; color:var(--gray-400); }
    .splide__slide { padding: 0 0.4rem; }
    .recipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .recipe-section h4 { font-size:0.75rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--gray-400); margin-bottom:0.75rem; }
    .recipe-section li { font-size:0.9rem; padding:0.35rem 0; border-bottom:1px solid var(--gray-200); list-style:none; }
    .recipe-section li:last-child { border:none; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand"><span>🍽️</span> EatEasy</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/meals">Meal Discovery</a></li>
      <li><a href="/breweries">Brewery Finder</a></li>
      <li><a href="/cocktails" class="active">Cocktail Pairing</a></li>
      <li><a href="/favorites">Favorites</a></li>
      <li><a href="/about">About</a></li>
    </ul>
  </nav>

  <section class="hero" style="padding:3rem 2rem 2.5rem;">
    <h1 style="font-size:clamp(1.6rem,4vw,2.5rem);">Cocktail Pairing</h1>
    <p>Search by ingredient to find cocktails that pair perfectly with your meal.</p>
    <div class="search-bar">
      <input type="text" id="cocktailInput" placeholder="Search by ingredient (e.g. vodka, lime juice, tequila)..." />
      <button class="btn btn-primary" id="searchBtn">Search</button>
    </div>
  </section>

  <main>
    <div id="status" class="status"></div>
    <div id="loader" class="loader" style="display:none;"><span class="loader-spinner"></span>Finding cocktails...</div>

    <!-- Splide slider for cocktail thumbnails -->
    <div id="sliderWrap" style="display:none;margin-bottom:2rem;">
      <div class="section-header" style="margin-bottom:1rem;">
        <h2 id="sliderTitle"></h2>
      </div>
      <section id="cocktailSlider" class="splide">
        <div class="splide__track">
          <ul class="splide__list" id="sliderList"></ul>
        </div>
      </section>
    </div>

    <!-- Cocktail full recipe detail -->
    <div id="detailPanel" class="detail-panel">
      <div class="detail-top">
        <img id="detailImg" src="" alt="">
        <div class="detail-meta">
          <h2 id="detailName"></h2>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;">
            <span id="detailCategory" class="tag tag-navy"></span>
            <span id="detailAlcoholic" class="tag tag-gold"></span>
            <span id="detailGlass" class="tag tag-gray"></span>
          </div>
          <button id="saveCocktailBtn" class="btn btn-outline btn-sm">♡ Save to Favorites</button>
        </div>
      </div>
      <div class="recipe-grid">
        <div class="recipe-section">
          <h4>Ingredients</h4>
          <ul id="cocktailIngredients"></ul>
        </div>
        <div class="recipe-section">
          <h4>Instructions</h4>
          <p id="cocktailInstructions" class="instructions"></p>
        </div>
      </div>
    </div>
  </main>

  <footer>EatEasy &mdash; INST 377 &middot; Spring 2026</footer>
  <div class="toast" id="toast"></div>
  <script src="/js/cocktails.js"></script>
</body>
</html>
