<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brewery Finder — EatEasy</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Chart.js: JS Library #1 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand"><span>🍽️</span> EatEasy</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/meals">Meal Discovery</a></li>
      <li><a href="/breweries" class="active">Brewery Finder</a></li>
      <li><a href="/cocktails">Cocktail Pairing</a></li>
      <li><a href="/favorites">Favorites</a></li>
      <li><a href="/about">About</a></li>
    </ul>
  </nav>

  <section class="hero" style="padding:3rem 2rem 2.5rem;">
    <h1 style="font-size:clamp(1.6rem,4vw,2.5rem);">Brewery Finder</h1>
    <p>Discover local craft breweries in any U.S. city.</p>
    <div class="search-bar">
      <input type="text" id="cityInput" placeholder="Enter a U.S. city (e.g. Baltimore, Denver)..." />
      <button class="btn btn-primary" id="searchBtn">Search</button>
    </div>
  </section>

  <main>
    <div id="status" class="status"></div>
    <div id="loader" class="loader" style="display:none;"><span class="loader-spinner"></span>Searching breweries...</div>

    <!-- Brewery type breakdown chart -->
    <div id="chartWrap" style="display:none;max-width:460px;margin-bottom:2rem;">
      <p style="font-size:0.75rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-400);margin-bottom:0.75rem;">Brewery Types Found</p>
      <canvas id="breweryChart" height="200"></canvas>
    </div>

    <div id="breweryGrid" class="card-grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));"></div>
  </main>

  <footer>EatEasy &mdash; INST 377 &middot; Spring 2026</footer>
  <div class="toast" id="toast"></div>
  <script src="/js/breweries.js"></script>
</body>
</html>
